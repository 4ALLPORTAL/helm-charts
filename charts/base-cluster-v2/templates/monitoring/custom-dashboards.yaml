{{- if and .Values.monitoring.enabled .Values.monitoring.mimir.enabled }}
{{/*
Hand-authored dashboards (as opposed to the gnetId community dashboards in
grafana.yaml), picked up by the same Grafana sidecar via grafana_dashboard: "1".
Each ConfigMap ships the raw dashboard JSON from ./dashboards/*.json unmodified.

The two etcd dashboards stay empty on Talos clusters until etcd is scraped:
Talos keeps `listen-metrics-urls` on 127.0.0.1:2381, so the metrics port has to
be opened per control plane node before any etcd series reach Mimir.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-node-clock-skew
  namespace: monitoring
  labels: {{- include "base-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
    grafana_dashboard: "1"
data:
  node-clock-skew.json: |-
{{ .Files.Get "dashboards/node-clock-skew.json" | indent 4 }}
---
