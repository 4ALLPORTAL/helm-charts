  namespace: monitoring
  labels: {{- include "base-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
    grafana_dashboard: "1"
data:
  backup-job-health.json: |-
{{ .Files.Get "dashboards/backup-job-health.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-flux-reconcile-health
  namespace: monitoring
  labels: {{- include "base-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
    grafana_dashboard: "1"
data:
  flux-reconcile-health.json: |-
{{ .Files.Get "dashboards/flux-reconcile-health.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cilium-hubble-drops
  namespace: monitoring
  labels: {{- include "base-cluster.labels" . | nindent 4 }}
