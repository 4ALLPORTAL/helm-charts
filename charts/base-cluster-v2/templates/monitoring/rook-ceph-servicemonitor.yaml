{{- if and .Values.monitoring.enabled .Values.monitoring.rookCeph.enabled }}
{{/* Rook-Ceph MGR → Mimir, via prometheusOperatorObjects on alloy-metrics. */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rook-ceph-mgr
  namespace: {{ .Values.monitoring.rookCeph.namespace }}
  labels: {{- include "base-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  endpoints:
    - port: http-metrics
      interval: 60s
  namespaceSelector:
    matchNames:
      - {{ .Values.monitoring.rookCeph.namespace | quote }}
  selector:
    matchLabels:
      app: rook-ceph-mgr
{{- end }}
