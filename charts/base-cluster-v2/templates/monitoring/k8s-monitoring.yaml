{{- if .Values.monitoring.enabled }}
{{/*
grafana/k8s-monitoring, via the Alloy Operator, split into role-specific
collectors: `alloy-metrics` (clustered — annotationAutodiscovery,
clusterMetrics, hostMetrics, prometheusOperatorObjects; CRDs in
crds/prometheus-operator-objects.yaml) and `alloy-logs` (DaemonSet —
podLogsViaLoki). To scrape something new, add a ServiceMonitor/PodMonitor
(see rook-ceph-servicemonitor.yaml). `monitoring.k8sMonitoring.logs.extraConfig`
is appended to the `alloy-logs` config, for logs no feature covers.
`monitoring.k8sMonitoring.logs.extraLogProcessingStages` is added to the pod
log pipeline itself, e.g. to drop lines before they reach Loki.
`monitoring.{mimir,loki}.selfMonitoring` adds the `integrations` feature, which
scrapes Mimir and Loki themselves.

kube-state-metrics and node-exporter are deployed as this chart's
`telemetryServices`, feeding `clusterMetrics`/`hostMetrics`.

Not DHI-hardened; sourced from the `grafana` HelmRepository, same as Mimir.
*/}}
{{- $clusterDomain := include "base-cluster.clusterDomain" . -}}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
  labels: {{- include "base-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s-monitoring
      version: {{ include "base-cluster.versions.k8sMonitoring.chart" . | quote }}
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: {{ .Release.Namespace }}
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    cluster:
      name: {{ .Values.global.clusterName | quote }}

    {{- with .Values.global.imagePullSecretName }}
    global:
      image:
        pullSecrets:
          - name: {{ . }}
      imagePullSecrets:
        - name: {{ . }}
    {{- end }}

    collectors:
      alloy-metrics:
        presets: [clustered]
        alloy:
          resources: {{- toYaml .Values.monitoring.k8sMonitoring.resources | nindent 12 }}
      alloy-logs:
        presets: [daemonset, filesystem-log-reader]
        {{- with .Values.monitoring.k8sMonitoring.logs.extraConfig }}
        extraConfig: {{- toYaml . | nindent 10 }}
        {{- end }}
        alloy:
          resources: {{- toYaml .Values.monitoring.k8sMonitoring.resources | nindent 12 }}

    destinations:
      {{- if .Values.monitoring.mimir.enabled }}
      mimir:
        type: prometheus
        url: http://mimir-distributor.monitoring.svc.{{ $clusterDomain }}:8080/api/v1/push
        tenantId: anonymous
      {{- end }}
      {{- if .Values.monitoring.loki.enabled }}
      loki:
        type: loki
        url: http://loki-loki-chart.monitoring.svc.{{ $clusterDomain }}:3100/loki/api/v1/push
      {{- end }}

    {{- if .Values.monitoring.mimir.enabled }}
    annotationAutodiscovery:
      enabled: true
      collector: alloy-metrics

    prometheusOperatorObjects:
      enabled: true
      collector: alloy-metrics

    clusterMetrics:
      enabled: true
      collector: alloy-metrics
      ## Job labels pinned to the kube-prometheus-stack convention, which is
      ## what community dashboards (Node Exporter Full, kube-prometheus-mixin)
      ## expect, rather than grafana/k8s-monitoring's own `integrations/*`.
      kube-state-metrics:
        enabled: {{ .Values.monitoring.kubeStateMetrics.enabled }}
        jobLabel: kube-state-metrics
        ## The integration allow-list drops kube_pod_container_status_ready
        ## (and the pod-level equivalent) — needed to tell "pod stuck
        ## NotReady" apart from "container crashlooping" for workloads like
        ## the mysql-operator's InnoDBCluster pods, whose readiness gate is
        ## set by an external controller rather than a liveness/readiness
        ## probe.
        metricsTuning:
          includeMetrics:
            - kube_pod_container_status_ready
            - kube_pod_status_ready
      cadvisor:
        jobLabel: cadvisor
      kubelet:
        jobLabel: kubelet

    {{- if .Values.monitoring.nodeExporter.enabled }}
    hostMetrics:
      enabled: true
      collector: alloy-metrics
      linuxHosts:
        enabled: true
        jobLabel: node-exporter
        ## The default allow-list is too narrow for community dashboards
        ## like Node Exporter Full (drops node_uname_info, node_load*,
        ## node_disk_*, node_netstat_*); pull in the integration list instead.
        ## That list still drops node_time_seconds (used for the dashboard's
        ## Uptime panel), so add it back explicitly.
        metricsTuning:
          useIntegrationAllowList: true
          includeMetrics:
            - node_time_seconds
    {{- end }}

    {{- $mimirSelf := .Values.monitoring.mimir.selfMonitoring.enabled }}
    {{- $lokiSelf := and .Values.monitoring.loki.enabled .Values.monitoring.loki.selfMonitoring.enabled }}
    {{- if or $mimirSelf $lokiSelf }}
    ## Metrics only: the integrations' log stages would also relabel and
    ## rewrite these pods' log lines in podLogsViaLoki.
    integrations:
      collector: alloy-metrics
      {{- if $mimirSelf }}
      mimir:
        instances:
          - name: mimir
            namespaces: [monitoring]
            labelSelectors:
              app.kubernetes.io/name: mimir
              app.kubernetes.io/instance: mimir
            ## The nginx gateway names its port http-metrics but has no /metrics.
            extraDiscoveryRules: |
              rule {
                source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
                regex         = "gateway"
                action        = "drop"
              }
            logs:
              enabled: false
      {{- end }}
      {{- if $lokiSelf }}
      loki:
        instances:
          - name: loki
            namespaces: [monitoring]
            ## The DHI chart labels its pods loki-chart, not the upstream loki.
            labelSelectors:
              app.kubernetes.io/name: loki-chart
              app.kubernetes.io/component: [single-binary, canary]
            ## The default allow-list lacks the compression metrics, needed to
            ## turn ingested bytes into stored bytes.
            metrics:
              tuning:
                includeMetrics:
                  - loki_ingester_chunk_compression_ratio_bucket
                  - loki_ingester_chunk_compression_ratio_count
                  - loki_ingester_chunk_compression_ratio_sum
                  - loki_ingester_chunk_stored_bytes_total
            logs:
              enabled: false
      {{- end }}
    {{- end }}
    {{- end }}

    {{- if or .Values.monitoring.kubeStateMetrics.enabled .Values.monitoring.nodeExporter.enabled }}
    telemetryServices:
      {{- if .Values.monitoring.kubeStateMetrics.enabled }}
      kube-state-metrics:
        deploy: true
      {{- end }}
      {{- if .Values.monitoring.nodeExporter.enabled }}
      node-exporter:
        deploy: true
      {{- end }}
    {{- end }}

    {{- if .Values.monitoring.loki.enabled }}
    podLogsViaLoki:
      enabled: true
      collector: alloy-logs
      {{- with .Values.monitoring.k8sMonitoring.logs.extraLogProcessingStages }}
      extraLogProcessingStages: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
