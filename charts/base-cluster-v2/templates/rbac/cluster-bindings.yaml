{{/*
Cluster-scoped bindings. A tier with no subjects emits no binding at all — an
empty ClusterRoleBinding grants nothing and only suggests someone is bound.
*/}}
{{- if .Values.rbac.enabled }}
{{- if include "base-cluster.rbac.hasSubjects" .Values.rbac.cluster.admin }}
{{/* The only blanket cluster-admin. Ships empty; `system:masters` stays break-glass. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: base-cluster:cluster-admin
  labels: {{- include "base-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  {{- include "base-cluster.rbac.subjects" (dict "subjects" .Values.rbac.cluster.admin "namespace" .Release.Namespace) | trim | nindent 2 }}
---
{{- end }}
{{- if include "base-cluster.rbac.hasSubjects" .Values.rbac.cluster.reader }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: base-cluster:cluster-reader
  labels: {{- include "base-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: base-cluster:cluster-reader
subjects:
  {{- include "base-cluster.rbac.subjects" (dict "subjects" .Values.rbac.cluster.reader "namespace" .Release.Namespace) | trim | nindent 2 }}
{{- end }}
{{- if .Values.rbac.tenant.listNamespaces }}
{{- $tenantSubjects := dict "groups" (list) "users" (list) "serviceAccounts" (list) }}
{{- range $namespace, $tiers := .Values.rbac.tenants }}
{{- range $_, $subjects := $tiers | default dict }}
{{- $subjects = $subjects | default dict }}
{{- $_ := set $tenantSubjects "groups" (concat $tenantSubjects.groups ($subjects.groups | default list)) }}
{{- $_ := set $tenantSubjects "users" (concat $tenantSubjects.users ($subjects.users | default list)) }}
{{- range $sa := $subjects.serviceAccounts | default list }}
{{- $_ := set $tenantSubjects "serviceAccounts" (append $tenantSubjects.serviceAccounts (ternary $sa (printf "%s/%s" $namespace $sa) (contains "/" $sa))) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $kind := list "groups" "users" "serviceAccounts" }}
{{- $_ := set $tenantSubjects $kind (index $tenantSubjects $kind | uniq | sortAlpha) }}
{{- end }}
{{- if include "base-cluster.rbac.hasSubjects" $tenantSubjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: base-cluster:namespace-lister
  labels: {{- include "base-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: base-cluster:namespace-lister
subjects:
  {{- include "base-cluster.rbac.subjects" (dict "subjects" $tenantSubjects "namespace" .Release.Namespace) | trim | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
