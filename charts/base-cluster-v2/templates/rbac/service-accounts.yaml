{{/*
ServiceAccounts for in-cluster automation. Bind them by naming
"<namespace>/<name>" under rbac.tenants or rbac.cluster.
*/}}
{{- if .Values.rbac.enabled }}
{{- $root := . }}
{{- range $sa := .Values.rbac.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "rbac.serviceAccounts[].name is required" $sa.name }}
  namespace: {{ required "rbac.serviceAccounts[].namespace is required" $sa.namespace }}
  labels: {{- include "base-cluster.labels" $root | nindent 4 }}
    app.kubernetes.io/component: rbac
  {{- with $sa.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $sa.automountServiceAccountToken | default false }}
{{- end }}
{{- end }}
