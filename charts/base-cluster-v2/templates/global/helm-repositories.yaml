{{/*
Centralized Flux HelmRepository sources for the upstream charts this chart
deploys. Adding a new component? Add its chart repo here, then reference it
from the component's HelmRelease.
OCI repos require type: oci; HTTPS repos omit the type field.
*/}}
{{/* `grafana` carries Mimir and k8s-monitoring (which bundles the Alloy
     Operator as a sub-chart dependency) — DHI mirrors neither. `stakater`
     carries the IngressMonitorController chart (not published as OCI; its image
     still comes from ghcr.io). loki, tempo and grafana come from `dhi` as
     hardened images; alloy/node-exporter/kube-state-metrics no longer have
     their own HelmReleases as of CL-1056 (folded into k8s-monitoring).
     `descheduler` (kubernetes-sigs), `k8s-cleaner` (ghcr.io OCI, the janitor)
     and `appscode` (Stash backup operator) are not DHI-hardened; mirror their
     images via global.imageRegistry when needed. */}}
{{- $repos := list
  (dict "name" "cilium"           "url" "https://helm.cilium.io/")
  (dict "name" "emberstack"       "url" "https://emberstack.github.io/helm-charts")
  (dict "name" "grafana"          "url" "https://grafana.github.io/helm-charts")
  (dict "name" "stakater"         "url" "https://stakater.github.io/stakater-charts")
  (dict "name" "descheduler"      "url" "https://kubernetes-sigs.github.io/descheduler/")
  (dict "name" "appscode"         "url" "https://charts.appscode.com/stable")
  (dict "name" "k8s-cleaner"      "url" "oci://ghcr.io/gianlucam76/charts"                  "type" "oci")
  (dict "name" "fluxcd-community" "url" "oci://ghcr.io/fluxcd-community/charts"            "type" "oci")
  (dict "name" "dhi"              "url" "oci://dhi.io"                                      "type" "oci" "secret" .Values.global.imagePullSecretName)
-}}
{{- range $repos }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "base-cluster.labels" $ | nindent 4 }}
spec:
  interval: 5m
  {{- with .type }}
  type: {{ . }}
  {{- end }}
  url: {{ .url | quote }}
  {{- with .secret }}
  secretRef:
    name: {{ . }}
  {{- end }}
{{- end }}
