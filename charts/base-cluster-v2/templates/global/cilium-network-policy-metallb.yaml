{{- if eq (include "base-cluster.networkPolicy.type" .) "cilium" }}
{{/*
CiliumNetworkPolicy for the MetalLB controller: apiserver access, webhook
ingress, and a metrics scrape from the monitoring namespace. The speakers are
hostNetwork, so Cilium has no endpoint for them and a policy would select
nothing.
*/}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metallb-controller
  namespace: metallb-system
  labels: {{- include "base-cluster.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metallb
      app.kubernetes.io/component: controller
  egress:
    - toEntities: [kube-apiserver]
    - toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
  ingress:
    - fromEntities: [kube-apiserver, remote-node, host]
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            {{- range .Values.global.networkPolicy.metallbMetricsPorts }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
{{- end }}
